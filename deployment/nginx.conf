# ============================================================
# Nginx reverse-proxy configuration for PneumoDetect
# Place at /etc/nginx/sites-available/pneumodetect
# Then: sudo ln -s /etc/nginx/sites-available/pneumodetect /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # SSL Certificates (use Let's Encrypt / certbot)
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header Referrer-Policy           "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Max upload size (must match Flask MAX_CONTENT_LENGTH)
    client_max_body_size 6M;

    # Serve static files directly (bypass Gunicorn for performance)
    location /static/ {
        alias /path/to/pneumonia-detection/app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy all other requests to Gunicorn
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Logs
    access_log /var/log/nginx/pneumodetect_access.log;
    error_log  /var/log/nginx/pneumodetect_error.log;
}
